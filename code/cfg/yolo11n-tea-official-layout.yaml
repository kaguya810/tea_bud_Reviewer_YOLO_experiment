# ==========================================================================================
# 「官方布局」对照配置 —— 目的：把预训练迁移率拉满，从而量化「起点」到底值多少
#
# 由来（`_mod/block` 的发现）：
#   ultralytics 的 checkpoint key 是**位置编码** `model.<层号>.*`，不是结构哈希。
#   所以每**插入一行**，后面所有层的编号平移，**整段失去预训练**。
#   本仓库的 3 尺度主配置 28 层，比官方 yolo11n 的 24 层多出的正好是 **4 行 LightSAFFMFusion**
#   （`Concat → LightSAFFMFusion → C3k2`），而官方是 `Concat → C3k2`。
#   后果：ours 的层 11~27（整个 neck + head）**编号与官方全部错开 → 迁移率 0%**。
#   （已实测：`Transferred 216/625`，216 项全在 backbone 层 1-10。）
#
# 本文件 = **官方 yolo11n 布局**，只保留两处自定义：
#   层 0  : EGAStem（官方是 Conv[64,3,2]）—— 唯一无法迁移的部分
#   层 2/4: C3k2DSA，但 **dsa_ratio=0** ⇒ 与官方 C3k2 **逐位一致**（§10 审计已证），故仍可 100% 迁移
#
# 与主配置的另外两处差异也**回退到官方**，以最大化迁移：
#   * Stage1/2 的 repeat 回到官方 2/2（代价：dsa_ratio 无法在 n=1 上表达，故置 0）
#   * 下采样路的 Conv 通道回到官方的不对称口径（[256,3,2] 而不是 [512,3,2]）
#
# 预期：迁移率从 216/625（34.6%）跳到接近 100%（除 EGAStem）。
# 用途：这是「起点值多少」的最干净测量臂 —— 与主配置只差「层号是否对齐」。
# ==========================================================================================

scale: n  # 装饰性：真正决定 scale 的是文件名里的 yolo11n 模式
nc: 4
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  # 层 0：唯一无法迁移的层（EGAStem 是全新模块）
  - [-1, 1, EGAStem, [64, 2, 5, 1.0]] # 0-P1/2   16ch
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4   32
  # C3k2 已被同名替换为 C3k2DSA；dsa_ratio=0 ⇒ 内部全为 C3k，与官方逐位一致
  - [-1, 2, C3k2, [256, False, 0.25, False, 1, True, 0, 0.0]] # 2-P2/4  64
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8   64
  - [-1, 2, C3k2, [512, False, 0.25, False, 1, True, 0, 0.0]] # 4-P3/8  128
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16  128
  - [-1, 2, C3k2, [512, True]] # 6-P4/16  128
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32  256
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32  256
  - [-1, 1, SPPF, [1024, 5]] # 9        256
  - [-1, 2, C2PSA, [1024]] # 10       256（官方 repeats=2，depth 0.5 -> n=1）

head:
  # ===== 以下与官方 yolo11n **逐行对应**，无任何插入行 =====
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12  cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13  -> 128  P4_td
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15  cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16  -> 64   P3_td   ← 检测输出
  - [-1, 1, Conv, [256, 3, 2]] # 17  官方口径：实际 64（与层 13 的 128 不对称）
  - [[-1, 13], 1, Concat, [1]] # 18  引用 13（官方写法）
  - [-1, 2, C3k2, [512, False]] # 19  -> 128  P4_bu   ← 检测输出
  - [-1, 1, Conv, [512, 3, 2]] # 20  官方口径：实际 128
  - [[-1, 10], 1, Concat, [1]] # 21
  - [-1, 2, C3k2, [1024, True]] # 22  -> 256  P5_bu   ← 检测输出
  - [[16, 19, 22], 1, Detect, [nc]] # 23  官方 Detect（c2=c3=64，与官方头逐位一致）
